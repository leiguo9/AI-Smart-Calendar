server:
  port: 8080

spring:
  application:
    name: ai-smart-calendar
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aiscalendar}
    username: ${DATABASE_USER:calendar}
    password: ${DATABASE_PASSWORD:calendar}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt:
    # Override in production via APP_JWT_SECRET (min 32 chars)
    secret: ${APP_JWT_SECRET:dev-only-change-me-ai-smart-calendar-secret-key}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    org.springframework.security: INFO
