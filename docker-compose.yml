services:
  db:
    image: postgres:16-alpine
    container_name: aiscalendar-db
    environment:
      POSTGRES_DB: aiscalendar
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d aiscalendar"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: aiscalendar-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/aiscalendar
      DATABASE_USER: calendar
      DATABASE_PASSWORD: calendar
      APP_JWT_SECRET: docker-dev-change-me-ai-smart-calendar-secret
      APP_CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: aiscalendar-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"

volumes:
  pgdata:
